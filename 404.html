<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — Помилка</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(200, 58, 46, 0.14),
                    transparent 35%
                ),
                #070708;
            color: #fff;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        /* Фонове світіння */

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .glow {
            position: absolute;
            width: 45vw;
            height: 45vw;
            max-width: 700px;
            max-height: 700px;
            border-radius: 50%;
            background: rgba(200, 58, 46, 0.12);
            filter: blur(120px);
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
        }

        .grid {
            position: absolute;
            inset: -50%;
            opacity: 0.035;

            background-image:
                linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);

            background-size: 70px 70px;

            transform:
                perspective(700px)
                rotateX(60deg)
                translateY(20%);
        }

        /* Основний контейнер */

        .page {
            position: relative;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px;
        }

        .content {
            position: relative;
            width: min(1100px, 100%);
            min-height: 80vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        /* Іконка */

        .icon-wrapper {
            position: relative;

            width: min(62vw, 560px);
            height: min(62vw, 560px);

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 15px;

            animation: floating 5s ease-in-out infinite;
        }

        .icon-wrapper::before {
            content: "";

            position: absolute;
            inset: 12%;

            border-radius: 50%;

            background: rgba(200, 58, 46, 0.15);

            filter: blur(60px);

            z-index: -1;
        }

        .icon {
            width: 100%;
            height: 100%;

            object-fit: contain;

            filter:
                drop-shadow(0 0 35px rgba(200,58,46,.2))
                drop-shadow(0 25px 60px rgba(0,0,0,.6));
        }

        /* Текст */

        .error-code {
            font-size: clamp(12px, 1vw, 15px);
            font-weight: 700;

            letter-spacing: 0.28em;
            text-transform: uppercase;

            color: rgba(255,255,255,.42);

            margin-bottom: 14px;
        }

        h1 {
            font-size: clamp(32px, 5vw, 62px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.045em;

            margin-bottom: 18px;
        }

        .description {
            max-width: 520px;

            font-size: clamp(15px, 1.5vw, 18px);
            line-height: 1.6;

            color: rgba(255,255,255,.48);

            margin-bottom: 32px;
        }

        /* Кнопка */

        .home-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            min-height: 52px;
            padding: 0 25px;

            border-radius: 16px;

            background: #fff;
            color: #090909;

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease;
        }

        .home-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 40px rgba(0,0,0,.35),
                0 0 30px rgba(255,255,255,.08);

            background: #f1f1f1;
        }

        .arrow {
            font-size: 18px;
            transition: transform .25s ease;
        }

        .home-button:hover .arrow {
            transform: translateX(4px);
        }

        /* Маленький статус */

        .status {
            position: absolute;

            bottom: 28px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 8px;

            color: rgba(255,255,255,.25);

            font-size: 11px;
            font-weight: 600;

            letter-spacing: .08em;
            text-transform: uppercase;

            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #C83A2E;

            box-shadow: 0 0 12px rgba(200,58,46,.8);
        }

        /* Анімація */

        @keyframes floating {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Телефон */

        @media (max-width: 600px) {

            body {
                overflow-y: auto;
            }

            .page {
                padding: 25px 20px;
            }

            .content {
                min-height: 100vh;
            }

            .icon-wrapper {
                width: 78vw;
                height: 78vw;

                max-width: 420px;
                max-height: 420px;

                margin-bottom: 5px;
            }

            h1 {
                font-size: 34px;
            }

            .description {
                font-size: 15px;
                max-width: 330px;
            }

            .home-button {
                min-height: 50px;
                padding: 0 22px;
            }

            .status {
                bottom: 15px;
            }
        }
    </style>
</head>
